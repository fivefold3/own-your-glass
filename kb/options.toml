category = "cloud"
name = "ThinQ and Home Hub"
what = "Stops LG's ThinQ cloud and smart-home links."
breaks = "ThinQ app, Home Hub, Matter, LG notifications"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "google-home"
category = "cloud"
name = "Google Home hub"
what = "Stops the Google Home hub."
breaks = "Google Home hub"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "buddy-sports"
category = "cloud"
name = "LG Buddy and sports alerts"
what = "Stops LG Buddy and sports alerts."
breaks = "LG Buddy, sports alerts"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "ai"
category = "cloud"
name = "AI features"
what = "Stops LG's cloud AI features."
breaks = "Life-on-Screen art, AI agent"
detail = "The TV's own AI Picture and AI Sound keep working (they run on the TV)."
presets = ["strict", "lockdown"]
since = "1.4"

[[option]]
id = "backup-presence"
category = "cloud"
name = "Settings backup and presence"
what = "Stops settings backup to LG and presence sensing."
breaks = "Settings backup"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "universal-control"
category = "cloud"
name = "Universal Control and LAN device scanning"
what = "Stops Universal Control and its network scanning."
breaks = "Universal Control"
detail = "The remote no longer controls boxes and soundbars (the volume pop-up shows a cross)."
presets = ["lockdown"]
since = "1.4"

# ----------------------------------------------------------- network --
[[option]]
id = "trackers"
category = "network"
name = "Tracker hostnames"
what = "Blocks ad, analytics and tracking hostnames."
breaks = ""
detail = "For everything on the TV, apps and browser included; also public DNS-over-HTTPS servers."
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "store-traffic"
category = "network"
name = "LG Store and account traffic"
what = "Cuts the LG servers behind the Content Store."
breaks = "App installs and updates, Home content"
detail = "Also stops Chromecast built-in from starting after a restart (Lockdown turns Cast off anyway)."
presets = ["lockdown"]
since = "1.4"

[[option]]
id = "remote-config"
category = "network"
name = "Remote configuration"
what = "Cuts LG's remote configuration servers."
breaks = "Online programme guide"
detail = "Also stops Chromecast built-in from starting after a restart (Lockdown turns Cast off anyway). Nothing else was noticed on the C5."
presets = ["lockdown"]
since = "1.4"

# ------------------------------------------------------------ access --
[[option]]
id = "remote-support"
category = "access"
name = "Remote support and root hygiene"
what = "Stops LG remote support and locks down root access."
breaks = "LG remote support"
detail = "Also keeps Homebrew Channel's telnet root shell off and fixes world-writable root files."
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "remote"

[[option]]
id = "account"
category = "access"
name = "Block LG account"
what = "Removes any LG account and blocks sign-in."
breaks = "Content Store installs, LG account features"
detail = "The sign-in screen shows a network error. With no account, LG cannot tie the TV to one and the account terms prompt never appears."
warning = "Any LG account is removed and signing in is blocked. Turn this off when you need to sign in."
presets = ["strict", "lockdown"]
hook = "account"
since = "1.4"

[[option]]
id = "terms"
category = "access"
name = "Terms prompts"
what = "Stops the 'User Agreements' prompt."
breaks = ""
detail = "The LG account terms prompt comes with a signed-in account: Block LG account stops it."
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "nag"

# ---------------------------------------------------------- advanced --
[[option]]
id = "early"
category = "advanced"
name = "Block before the boot hook"
what = "Writes the launch block list and the gateway table into the TV's own files, so they hold from the first second of a boot instead of when Own Your Glass starts."
breaks = ""
warning = "While this is on, restarting the TV no longer gives you a stock TV, and turning boot persistence off does not undo it. Turn this option off, restore, or uninstall to undo it."
presets = []
hook = "early"
needs_test = true
since = "planned"
