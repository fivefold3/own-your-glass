# The user-facing options: what the app's Customize screen toggles and what
# the presets are made of. Everything OYG does belongs to exactly one option
# (services.toml, sdx.toml, hosts.toml, settings.toml, apps.toml say which).
#
# Fields:
#   id        stable id (the state scope on the TV; never reuse a retired one)
#   category  categories.toml id
#   name      shown in the app
#   what      what it does, in one or two plain sentences
#   breaks    what stops working ("" = nothing the owner would notice)
#   presets   which presets turn it on: recommended, strict, lockdown
#   hook      toolkit code the option runs besides its declared contents
#   warning   a confirm dialog before turning it on
#   needs_test  true = not yet verified on a TV; kept out of presets until it is
#   since     the first build that ships it ("planned" = not yet)

# --------------------------------------------------------------- ads --
[[option]]
id = "acr"
category = "ads"
name = "Content recognition (ACR)"
what = "Stops content recognition (ACR) of what you watch."
breaks = "Live Plus overlays"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "ads"
category = "ads"
name = "Ad services"
what = "Stops LG's ad ID, ad logs and ad apps, and turns the ad settings off."
breaks = "Reset advertising ID, LG Shop"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "adid"
category = "ads"
name = "Opt-out advertising ID"
what = "Set LG's advertising ID to zeros (opt-out)."
breaks = ""
detail = "Re-applied at every start; the ID file is covered read-only, so nothing can write a new one. The device IDs LG uses to recognise the TV are left alone."
presets = ["recommended", "strict", "lockdown"]
hook = "adid"
since = "1.4"

[[option]]
id = "promos"
category = "ads"
name = "Home promotions and recommendations"
what = "Stops the promoted rows and AI tips on Home."
breaks = "Home preview rows, promo cards, AI tips"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "lgchannels"
category = "ads"
name = "LG Channels"
what = "Turns off LG's free ad-supported channels."
breaks = "LG Channels"
detail = "Turned off again, LG Channels needs a TV restart (the TV reads its hidden apps only at start-up); the app offers one."
presets = ["strict", "lockdown"]
since = "1.4"

