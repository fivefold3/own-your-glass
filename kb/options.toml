[[option]]
id = "diagnostics"
category = "usage"
name = "Crash and log uploads"
what = "Stops crash reports and log uploads to LG."
breaks = ""
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "diagnostics"

[[option]]
id = "usage-logs"
category = "usage"
name = "Viewing and usage logs"
what = "Stops the logs of what you watch and use."
breaks = "Reset usage data, recent-apps order, monthly report"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "consents"
category = "usage"
name = "Tracking consents"
what = "Declines every tracking and ad consent."
breaks = ""
detail = "The basic terms of use and privacy policy stay accepted."
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "consents"

[[option]]
id = "hbbtv-tracking"
category = "usage"
name = "HbbTV tracking"
what = "Asks broadcasters' interactive pages not to track you."
breaks = ""
presets = ["recommended", "strict", "lockdown"]
since = "1.4"

[[option]]
id = "hbbtv"
category = "usage"
name = "HbbTV"
what = "Turns off broadcasters' interactive pages."
breaks = "Freeview Plus, red button"
detail = "Not yet tested on a TV with broadcast reception."
presets = ["strict", "lockdown"]
needs_test = true
since = "1.4"

# ------------------------------------------------------------- voice --
[[option]]
id = "voice"
category = "voice"
name = "Voice assistants and wake words"
what = "Stops the voice assistants and wake words."
breaks = "Voice search, Alexa, ThinQ AI"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "voice"

[[option]]
id = "mic"
category = "voice"
name = "Built-in microphone"
what = "Blocks the built-in microphone."
breaks = "Hands-free voice"
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "mic"

[[option]]
id = "voice-core"
category = "voice"
name = "Voice framework and search"
what = "Also stops the voice framework and search."
