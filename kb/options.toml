since = "1.4"

# ------------------------------------------------------------ screen --
[[option]]
id = "capture"
category = "screen"
name = "Screen-capture shield"
what = "Hides the screen captures the OLED service keeps."
breaks = ""
detail = "Also blocks a vendor video-plane grabber."
presets = ["recommended", "strict", "lockdown"]
since = "1.4"
hook = "capture"

# ----------------------------------------------------------- casting --
[[option]]
id = "airplay"
category = "casting"
name = "AirPlay"
what = "Turns off AirPlay."
breaks = "AirPlay, HomeKit (Siri)"
detail = "The TV still shows in the AirPlay list, but connecting fails."
presets = ["strict", "lockdown"]
since = "1.4"

[[option]]
id = "cast"
category = "casting"
name = "Google Cast"
what = "Turns off Chromecast built-in."
breaks = "Google Cast"
detail = "The TV no longer shows up as a Cast device."
presets = ["strict", "lockdown"]
since = "1.4"

[[option]]
id = "phone"
category = "casting"
name = "Phone apps and second screen"
what = "Stops phones controlling the TV over the network."
breaks = "Phone remote apps, launching apps from a phone, LG Link"
detail = "Turned off again, phone remote apps need a TV restart (LG's phone server starts only with the TV); the app offers one."
presets = ["strict", "lockdown"]
hook = "phone"
since = "1.4"

[[option]]
id = "miracast"
category = "casting"
name = "Screen Share"
what = "Turns off Screen Share."
breaks = "Screen Share"
detail = "Also stops the TV's network announcements (avahi), which the Google Home hub uses to find devices. Turned off again, Screen Share needs a TV restart; the app offers one."
presets = ["strict", "lockdown"]
hook = "miracast"
since = "1.4"

[[option]]
id = "uei-cloud"
category = "casting"
name = "Universal Control cloud lookups"
what = "Stops Universal Control reporting your devices to UEI's cloud."
breaks = ""
detail = "Devices already set up keep working and new ones still set up (C5)."
presets = ["strict", "lockdown"]
since = "1.4"

[[option]]
id = "lan"
category = "casting"
name = "LAN firewall"
what = "Closes the TV to all inbound connections from your local network."
breaks = "SSH, AirPlay, Google Cast, phone apps, Screen Share, network devices in Universal Control"
detail = "Replies to connections the TV makes itself (streaming, browsing) still get through. IPv6 is off while it is on (the firewall cannot filter it). `oyg lan allow <ip>` lets a device through, for example your computer for SSH; otherwise turn the firewall off from the app on the TV."
presets = ["strict", "lockdown"]
hook = "lan"
since = "1.4"

# ------------------------------------------------------------- cloud --
[[option]]
