# Every service OYG blocks, releases or must never touch. One record per
# service. Only names, paths and findings are recorded here, never LG files.
#
# Spec fields (what lib/svc.sh receives, see there):
#   unit binary comm argmatch ls2 flags
#   binary "?" = find by comm in the bin dirs, else the unit's ExecStart
#   flags: u (unified JS server), m (/media/system: block by name only),
#          j=<jail>, L=dynamic|static|unified|jailed (the expected launch model)
# Other fields:
#   option    options.toml id
#   action    block (default), release (earlier versions blocked it; the
#             spec is as it was), never (see [never])
#   legacy    the 1.4 module that carries it (tools/kb.py checks parity)
#   since     first build that ships it; "planned" = not yet
#   needs_test  not yet verified on a TV
#   what, sends, breaks, note, evidence (paths in the research repo)

# =================================================================== acr ==
[[service]]
id = "acr"
option = "acr"
legacy = "acr"
since = "1.2"
binary = "?"
comm = "acr2"
ls2 = "com.webos.service.acr"
flags = ["L=dynamic"]
what = "ACR daemon: captures TV output audio (not the microphone) from broadcast and HDMI and fingerprints it with the Alphonso plugin; has a video-frame path."
sends = "Fingerprints, nearby Wi-Fi BSSIDs, wired MAC, HDMI device identity and the advertising ID to Alphonso (prov-lg.alphonso.tv, eulacheck.alphonso.tv and hosts it learns)."
evidence = ["2026-09-25-service-audit/reports/acr-ads.md"]

[[service]]
id = "adoverlay"
option = "acr"
legacy = "acr"
since = "1.2"
binary = "?"
comm = "adoverlay-service"
ls2 = "com.webos.service.adoverlay"
flags = ["L=dynamic"]
what = "Shoppable and 'Live Promotion' overlays keyed on ACR (Alphonso adoverlay, libshopping)."
sends = "Through ACR and lgshop_secure."
evidence = ["2026-09-25-service-audit/reports/acr-ads.md"]

[[service]]
id = "adoverlay-legacy"
option = "acr"
legacy = "acr"
since = "1.2"
unit = "adoverlay.service"
binary = "?"
comm = "adoverlay"
what = "Older name of the ad overlay service; absent on every surveyed image, kept for older firmware."

[[service]]
id = "livepick-plus"
option = "acr"
legacy = "acr"
since = "1.2"
binary = "?"
comm = "livepick-plus"
ls2 = "com.webos.service.livepickplus"
flags = ["L=dynamic"]
what = "Turns ACR and guide data into notice-bar offers (food delivery, shopping). On webOS 11 it grabs Live TV and HDMI frames and posts them to EdgeVideo AI for shoppable 'moments'."
sends = "Offers; on webOS 11 frames to moments-edge-service.edgevideo.ai (inferred)."
evidence = ["2026-09-25-service-audit/reports/acr-ads.md", "firmware-survey/results/webos11-c5.md"]

[[service]]
id = "admanager"
option = "ads"
legacy = "acr"
since = "1.2"
binary = "?"
comm = "admanager"
ls2 = "com.webos.service.admanager"
flags = ["L=dynamic"]
what = "Advertising ID (IFA), ad cookie, fck, click tracking; launches the consent manager and the full-screen ad app."
sends = "info.lgsmartad.com, directly with the gateway's headers."
breaks = "Settings' 'reset advertising ID' and Do-Not-Sell update fail silently."
