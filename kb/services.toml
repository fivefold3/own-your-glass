what = "'Log service for the advertisement': downloads an encrypted Python script through the Content Store's resource channel and runs it with any-luna, any-HTTP rights. The script collects foreground-app sessions, channels, installs, IFA/LMT and the MAC."
sends = "<ric>.api.adts.lgtvcommon.com (inactive on the C5 only because of a US-only check and server config)."
note = "comm is com.webos.servi, shared by many daemons: matched by executable only."
evidence = ["2026-09-25-service-audit/README.md#4"]

