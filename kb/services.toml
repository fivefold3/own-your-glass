# ================================================================= never ==
# Hard: breaks the TV, risks the panel, or is shared infrastructure. No
# option may block these. Soft never-touch services (voiceconductor, the
# voice hub, iconnectivity) are ordinary records above, only allowed in
# Lockdown options.
# The webOS generations Own Your Glass has been run on (the C5 at 10.3). On
# a generation it knows from firmware only, static services (always-on units
# other daemons call and wait for) are left running: a caller of a stopped
# static service can hang, and only a run on a TV shows which do.
[run_on]
generations = ["10.3"]

[never]
paths = [
  "/bin/sh", "/bin/bash", "/bin/busybox", "/usr/bin/busybox", "/bin/busybox.*",
  "/usr/bin/luna-send", "/usr/bin/iotjs", "/usr/bin/node", "/usr/bin/run-iot-js-service",
  "/usr/bin/run-js-service", "/usr/bin/run-service", "/usr/bin/jailer", "/usr/bin/python3*",
  "/usr/bin/socat", "/usr/bin/jsservicelauncher", "/usr/bin/flutter-client",
  "/usr/sbin/ls-hubd", "/usr/sbin/sdx", "/usr/sbin/tvdataexchanger",
  "/usr/sbin/pacrunner", "/usr/sbin/crashd", "/usr/sbin/eplmanager", "/usr/sbin/captureservice",
  "/dev/hidraw*", "/usr/bin/systemctl", "/bin/systemctl", "/lib/systemd/systemd",
  "/usr/lib/systemd/systemd", "/usr/palm/services/jsservicelauncher*",
]
reasons = [
  "sdx: binding it silently kills the Settings UI; the gateway is filtered by table instead",
  "eplmanager: OLED pixel care; stopping it risks the panel",
  "captureservice: shared by pixel care and every screen capture",
  "iconnectivity (soft): Universal Control and the IR blaster; binding it broke external-speaker control and made Settings take ~8 s",
  "/dev/hidraw*: every remote button rides on it",
  "interpreters and launchers: shared by everything",
]
# soft: costs features the owner may give up; only an option in no preset
# but Lockdown may touch these (tools/kb.py checks)
soft_paths = ["/usr/sbin/iconnectivity"]
ls2 = [
  "org.webosbrew.*", "org.ownyourglass.*", "com.palm.*", "com.webos.service.jsserver",
  "com.webos.service.secondscreen.gateway", "com.webos.service.settingsui", "com.webos.service.sdx",
  "com.webos.service.voiceconductor", "com.webos.service.voiceinput", "com.webos.service.ics",
  "com.webos.service.ics.*", "com.webos.service.eulaservice", "com.webos.service.accountmanager",
  "com.webos.service.capture", "com.webos.service.servicemanager", "com.webos.service.systemprofile",
  "com.webos.settingsservice", "com.webos.service.settings", "com.webos.applicationManager",
  "com.webos.service.applicationmanager", "com.webos.bootManager", "com.webos.notification",
]
ls2_allow = ["com.palm.uploadd"]
