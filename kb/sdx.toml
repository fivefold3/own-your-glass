# LG's gateway (sdx) serviceNames: every name seen in a factory table
# (webOS 6.5 to 11.2) or in the C5's server-pushed table. action:
#   block  routed to oyg.invalid when its option is on
#   keep   a function the TV needs; only a Lockdown option may block it
#   never  sign-in, the clock or DRM: no option may block it
# legacy = "sdx" marks the names 1.4's SDX_BLOCK carries (parity check).
# callers and what come from the audit (reports/gateway-consent-remote.md §1)
# and the webOS 11 deep dive (results/webos11-c5.md §3).

# ------------------------------------------------------------- never --
[[name]]
name = "sdp_auth"
action = "never"
what = "Device authentication for every gateway call."

[[name]]
name = "sdp_init"
action = "never"
what = "Initialisation; the clock's 'sdp' time source; AirPlay provisioning and many others."

[[name]]
name = "sdp_common"
action = "never"
what = "Common configuration, including ACR config; the TV's first time source."

[[name]]
name = "device_keys"
action = "never"
what = "DRM and secure key provisioning (keyinstall, webOS 11)."

