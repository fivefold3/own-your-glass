# ------------------------------------------------------------ consent --
# The consent list (eulaInfoNetwork) ids and the eulaStatus permission flags
# the consents option declines (lib/eula.sh). The basic terms (S_SVC terms
# of use, S_PRG privacy policy) and generalTermsAllowed, networkAllowed,
# chpAllowed are never touched: declining them raises the agreements wall on
# every launch.
[eula]
option = "consents"
legacy = "consent"
ids = ["S_VNG", "S_PRV", "S_TAD", "S_TAG", "S_ADG", "S_ADC", "S_ADD", "S_VDC", "S_VDD", "S_NVC", "S_NVD", "S_MKT", "S_DPA", "S_ALL"]
flags = [
  "acrAllowed", "acrOnAllowed", "acrAdAllowed", "acrGdprAllowed", "shoppingOnAllowed", "veranceOnAllowed",
  "voiceAllowed", "voice2Allowed", "marketingOnAllowed", "customAdAllowed", "customadsAllowed",
  "thirdPartySharingAllowed", "remoteDiagAllowed", "additionalDataAllowed", "additional1Allowed",
  "additional2Allowed", "additional3Allowed", "additional4Allowed", "additional5Allowed", "cookiesAllowed",
]
