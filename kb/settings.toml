# System settings OYG sets through LG's settings service, by option. The
# previous value is recorded the first time a key is changed and put back on
# restore. Keys a firmware does not have are skipped (lib/settings.sh).
# legacy = "consent" marks the keys 1.4's consent module sets (parity).
# Values are JSON as settingsservice takes them.

[[setting]]
category = "general"
key = "homePromotion"
value = '"off"'
option = "promos"
legacy = "consent"

[[setting]]
category = "general"
key = "personalRecommend"
value = '{"value":"off","changedByUser":true}'
option = "promos"
legacy = "consent"

