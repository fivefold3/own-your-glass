# Hostnames sent nowhere through /etc/hosts, by option. /etc/hosts has no
# wildcards, so names are exact, with two templates:
#   {ric}.  the regional prefixes LG uses: aic. eic. kic. (and the bare name)
#   {cc}.   this TV's country, lower case (au., de., …)
# legacy = "network" marks the names in 1.4's etc/blocklist.txt (parity).
# The gateway's own hosts are not listed: the network module adds the ones
# only blocked gateway names use, from the TV's routing table.

# ---------------------------------------------------------------- ads --
[[host]]
names = ["ads.lgtvcommon.com", "aic.ads.lgtvcommon.com", "ad.lgappstv.com", "lgsmartad.com", "info.lgsmartad.com", "de.info.lgsmartad.com", "smart.adtvc.app", "adsdtvc.com", "initscr.lge.com"]
option = "ads"
legacy = "network"

[[host]]
names = ["{cc}.membership.lgwebostv.com", "{cc}.emp.lgsmartplatform.com", "{cc}.lgeapi.com"]
option = "account"
since = "1.4"
note = "The LG account sign-in page (loaded by com.webos.app.membership), the account backend accountmanager signs in, refreshes tokens and checks terms against (EMP), and LG's API gateway the page called next. Seen in the router DNS log when the sign-in screen opened (C5, au.); au.lgeapi.com appeared at no other time. Blocked, the sign-in screen shows its network-error page."

[[host]]
names = ["de.emp.lgsmartplatform.com"]
option = "ads"
legacy = "network"
retire = true
note = "emp.lgsmartplatform.com is the LG account backend (accountmanager's empbackend); sinkholing the German one may break sign-in there. Dropped by the option engine unless shown to be ad-only."

[[host]]
names = ["{ric}.api.adts.lgtvcommon.com", "{ric}.videoads.lgtvcommon.com", "{ric}.fooddelivery.lgtvcommon.com", "{ric}.lgshopsvc.lgappstv.com"]
option = "ads"
since = "1.4"
note = "api.adts: the ad-log collector (lsa); videoads, fooddelivery: overlay ads; lgshopsvc: LG shop."

# ---------------------------------------------------------------- acr --
[[host]]
names = ["alphonso.tv", "cdn-aas-campaigns.alphonso.tv", "konograma.com", "marker.konograma.com", "marker2.konograma.com"]
option = "acr"
legacy = "network"

[[host]]
names = ["prov-lg.alphonso.tv", "eulacheck.alphonso.tv", "config-overlay-ads.alphonso.tv", "{ric}.videoacr.lgtvcommon.com", "moments-edge-service.edgevideo.ai", "moments-edge-service-342233178764.us-central1.run.app"]
option = "acr"
since = "1.4"
note = "The Alphonso SDK learns more names at runtime; block *.alphonso.tv at the router. EdgeVideo: webOS 11 livepick-plus frame uploads."

# ------------------------------------------------------------- promos --
[[host]]
names = ["homeprv.lgtvcommon.com", "recommend.lgtvcommon.com", "nudge.lgtvcommon.com", "eic.nudge.lgtvcommon.com", "eic.wiseconfig.lgtvcommon.com", "pnv.lgtvcommon.com", "qcardservice.lgtvcommon.com", "lggalleryplus.com", "cf-kic.lggalleryplus.com"]
option = "promos"
legacy = "network"

[[host]]
names = ["{ric}.lggalleryplus.com", "{ric}.lgrecommends.lgappstv.com"]
option = "promos"
