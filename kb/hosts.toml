# -------------------------------------------------------------- never --
# Never sinkholed, whatever an option says.
# The codes LG puts in front of its hosts, for {ric}. and {cc}. names when the
# TV's own codes are not known yet (resources/network.sh falls back to all of
# them and says so). Regions: the five LG's own service tables name
# (billing, homeconnect defaultServerOption.js). Countries: the union of
# etc/palm/countryList.json on webOS 10.3 and 11.2 (placeholders __ and
# xa-xe left out); the TV's own list is read first where it exists.
[codes]
regions = ["aic", "eic", "kic", "cic", "ruc"]
countries = [
  "ae", "al", "ar", "at", "au", "ba", "be", "bg", "bh", "br", "by", "ca", "ch", "cl", "cm", "cn",
  "co", "cz", "de", "dk", "dz", "ec", "ee", "es", "fi", "fr", "gb", "gh", "gr", "hk", "hn", "hr",
  "hu", "id", "ie", "il", "in", "iq", "ir", "is", "it", "jo", "jp", "ke", "kh", "kr", "kw", "kz",
  "lb", "lk", "lt", "lu", "lv", "ly", "ma", "mk", "mm", "mn", "mu", "mw", "mx", "my", "na", "ng",
  "nl", "no", "nz", "om", "pa", "pe", "ph", "pk", "pl", "pt", "qa", "ro", "rs", "ru", "sa", "se",
  "sg", "si", "sk", "th", "tn", "tr", "tw", "ua", "ug", "us", "uz", "ve", "vn", "ye", "za", "zm",
  "zw",
]

[never]
names = ["lgtvonline.lge.com", "connectivitycheck.gstatic.com", "ngfts.lge.com", "tv.wiselg.com", "tv.wiselg.cn", "nextlgsdp.com", "lgtvsdp.com", "app.lgwebostv.com", "snu.lge.com", "su.lge.com"]
suffixes = ["-ngfts.lge.com", ".ngfts.lge.com"]
prefixed = ["tv.wiselg.com", "tv.wiselg.cn", "nextlgsdp.com", "lgtvsdp.com", "app.lgwebostv.com"]
reasons = [
  "lgtvonline.lge.com: ConnMan's online check; without it the TV thinks it is offline",
  "ngfts: the terms-and-conditions UI loads from it and shows 'system error' when it is sinkholed",
  "<CC>/<RIC>.tv.wiselg.com: webOS 11 carries sign-in, the clock and the Store on it; only the gateway table can separate telemetry",
  "<CC>.nextlgsdp.com / lgtvsdp.com: LG's clock rides on them; sinkholing broke TLS once (clock fell back to 2021)",
  "<CC>.app.lgwebostv.com: the Content Store",
  "snu/su.lge.com: firmware updates are Homebrew Channel's toggle, the owner's call",
]
