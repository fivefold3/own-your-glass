name: build ipk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # the release step attaches the ipk and manifest to the tag's release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax check
        run: |
          for f in toolkit/oyg toolkit/boot-hook toolkit/lib/*.sh toolkit/etc/*.sh toolkit/hooks/*.sh toolkit/resources/*.sh tools/*.sh tests/*.sh; do sh -n "$f"; done
      - name: knowledge base (kb/*.toml)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/kb.py check
          python3 tools/kb.py drift
          python3 tests/test_kb.py
          python3 tools/kb.py docs && git diff --exit-code docs/COMPATIBILITY.md README.md
      - name: tests (BusyBox sh and awk, as on the TV)
        run: |
          sudo apt-get install -y -q busybox-static >/dev/null
          BUSYBOX=$(command -v busybox) tests/run.sh
      - name: shellcheck
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -s sh -S warning -e SC2034,SC2039,SC3043,SC2086,SC2046,SC1090,SC1091,SC2154 toolkit/oyg toolkit/lib/*.sh toolkit/hooks/*.sh toolkit/resources/*.sh || true
      - name: build
        run: tools/build-ipk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/org.ownyourglass.app.manifest.json
